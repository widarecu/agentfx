version: '3.8'

services:
  postgres-dev:
    image: postgres:15-alpine
    container_name: agentfx-postgres-dev
    environment:
      POSTGRES_DB: agentfx_dev
      POSTGRES_USER: agentfx
      POSTGRES_PASSWORD: agentfx
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentfx -d agentfx_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dev-network

volumes:
  postgres_dev_data:

networks:
  dev-network:
    driver: bridge
