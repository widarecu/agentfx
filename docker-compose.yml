# AgentFX Docker Development Stack
#
# Usage:
#   make docker-up PROFILE=dev   # Start dev stack
#   make docker-up PROFILE=test  # Start test stack (volume wiped by `make e2e`)
#   make docker-up PROFILE=uat   # Start UAT stack (long-lived; NEVER run e2e here)
#   make docker-down PROFILE=dev
#   make docker-logs PROFILE=dev
#
# Credentials are loaded from .env.development / .env.test / .env.uat automatically.
#
# Environment isolation rules (also in CLAUDE.md):
#   • dev   — developer verification; ports 8000/5173/5432; long-lived but
#             may be wiped on demand for clean rebuilds.
#   • test  — automated/E2E; ports 8001/5174/5433; volume `postgres_test_data`
#             is destroyed by `scripts/run-e2e-tests.sh` every run.
#   • uat   — user exploratory testing (Wilson's day-to-day stack);
#             ports 8002/5175/5434; volume `postgres_uat_data` MUST persist.
#             NEVER run `make e2e` against UAT — the E2E script wipes
#             volumes and would destroy 6-year OANDA backfills + user
#             accounts. A guard in `scripts/run-e2e-tests.sh` refuses
#             to run unless PROFILE is `test`.

services:
  # ── Development services (--profile dev) ────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: agentfx-postgres
    profiles: ["dev"]
    environment:
      POSTGRES_USER: agentfx
      POSTGRES_PASSWORD: agentfx
      POSTGRES_DB: agentfx_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "agentfx", "-d", "agentfx_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentfx-backend
    profiles: ["dev"]
    ports:
      - "8000:8000"
    env_file:
      - .env.development
    environment:
      # Override DB host for Docker networking (localhost -> postgres service)
      DATABASE_URL: postgresql://agentfx:agentfx@postgres:5432/agentfx_dev
      BACKEND_CORS_ORIGINS: http://localhost:5173,http://localhost:8000
      # Ingestion knobs: same single-source-of-truth pattern as the
      # test profile. Defaults shown here mirror the Pydantic defaults
      # in api/core/config.py so a reader of compose alone sees what
      # the container will use. Override via shell at `make docker-up`
      # time (e.g. `INGESTION_ENABLED=false make docker-up PROFILE=dev`
      # to spin up dev without ingestion). The same vars also exist on
      # the backend-test service — see CLAUDE.md → "Ingestion toggle:
      # three-surface model" for the design rationale.
      INGESTION_ENABLED: "${INGESTION_ENABLED:-true}"
      # Dev default is 5y (1825) — meaningful local evolution runs need
      # multi-year history, vs the test profile which defaults to 7d
      # because E2E pre-seeds deterministic data.
      BACKFILL_DAYS: "${BACKFILL_DAYS:-1825}"
      CANDLE_INSTRUMENTS: "${CANDLE_INSTRUMENTS:-EUR_USD,GBP_USD,USD_JPY,AUD_USD,USD_CHF,USD_CAD}"
      CANDLE_GRANULARITIES: "${CANDLE_GRANULARITIES:-M1,M5,M10,M30,H1,H4,H12,D,W,M}"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./portal/web
      dockerfile: Dockerfile
    container_name: agentfx-frontend
    profiles: ["dev"]
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_ENVIRONMENT: development

  # ── Test services (--profile test) ──────────────────────────────────

  postgres-test:
    image: postgres:15-alpine
    container_name: agentfx-postgres-test
    profiles: ["test"]
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: agentfx_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "test_user", "-d", "agentfx_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentfx-backend-test
    profiles: ["test"]
    ports:
      - "8001:8000"
    env_file:
      - .env.test
    environment:
      # Override for Docker networking
      DATABASE_URL: postgresql://test_user:test_password@postgres-test:5432/agentfx_test
      BACKEND_CORS_ORIGINS: http://localhost:5174,http://localhost:8001
      # Ingestion worker toggle for the test profile. Defaults to "false"
      # because the E2E suite pre-seeds deterministic candle data via
      # scripts/seed_test_candles.py — running OANDA backfill in parallel
      # makes timeframe-availability tests timing-dependent.
      #
      # For acceptance/exploratory runs that need real OANDA data, set
      # INGESTION_ENABLED=true in the shell before `make docker-up
      # PROFILE=test` (or `make docker-up PROFILE=test INGESTION_ENABLED=true`).
      # See CLAUDE.md → "Running an acceptance/exploratory test session"
      # for the full flow.
      INGESTION_ENABLED: "${INGESTION_ENABLED:-false}"
      # Same parameterisation for backfill window — defaults to 7 days
      # for the E2E flow; set to a larger value (e.g. 365) for acceptance
      # runs that need a year+ of history.
      BACKFILL_DAYS: "${BACKFILL_DAYS:-7}"
      # Narrow the backfill scope from the default 6 pairs × 10
      # granularities (which would run for hours on a fresh DB). When
      # unset, the ingestion worker uses its built-in defaults from
      # api/core/config.py. Pass these via shell for targeted backfills:
      #   CANDLE_INSTRUMENTS=EUR_USD CANDLE_GRANULARITIES=M1 \
      #     make docker-up PROFILE=test INGESTION_ENABLED=true BACKFILL_DAYS=2190
      CANDLE_INSTRUMENTS: "${CANDLE_INSTRUMENTS:-EUR_USD,GBP_USD,USD_JPY,AUD_USD,USD_CHF,USD_CAD}"
      CANDLE_GRANULARITIES: "${CANDLE_GRANULARITIES:-M1,M5,M10,M30,H1,H4,H12,D,W,M}"
    volumes:
      # Bind-mount scripts/ so `docker compose exec backend-test python scripts/seed_test_data.py`
      # works without shipping test-only seed scripts in the production image.
      - ./scripts:/app/scripts:ro
    depends_on:
      postgres-test:
        condition: service_healthy

  frontend-test:
    build:
      context: ./portal/web
      dockerfile: Dockerfile
    container_name: agentfx-frontend-test
    profiles: ["test"]
    ports:
      - "5174:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8001/api/v1
      VITE_ENVIRONMENT: test

  # ── UAT services (--profile uat) ────────────────────────────────────
  # User Acceptance Testing — Wilson's long-lived exploratory stack.
  # The `postgres_uat_data` volume must NEVER be wiped automatically.
  # The E2E script (scripts/run-e2e-tests.sh) has a guard that refuses
  # to run against this profile.

  postgres-uat:
    image: postgres:15-alpine
    container_name: agentfx-postgres-uat
    profiles: ["uat"]
    environment:
      POSTGRES_USER: uat_user
      POSTGRES_PASSWORD: uat_password
      POSTGRES_DB: agentfx_uat
    ports:
      - "5434:5432"
    volumes:
      - postgres_uat_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "uat_user", "-d", "agentfx_uat"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-uat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentfx-backend-uat
    profiles: ["uat"]
    ports:
      - "8002:8000"
    env_file:
      - .env.uat
    environment:
      # Override DB host for Docker networking
      DATABASE_URL: postgresql://uat_user:uat_password@postgres-uat:5432/agentfx_uat
      BACKEND_CORS_ORIGINS: http://localhost:5175,http://localhost:8002
      # Ingestion knobs — same three-surface model as dev/test. UAT
      # default is ingestion ON because this stack exists to hold real
      # OANDA history for manual exploration; default BACKFILL_DAYS is
      # 6 years (2190) to match the user's typical evolution-run data
      # window for EUR_USD M1. Override per-invocation:
      #   CANDLE_INSTRUMENTS=EUR_USD CANDLE_GRANULARITIES=M1 \
      #     make docker-up PROFILE=uat BACKFILL_DAYS=2190
      INGESTION_ENABLED: "${INGESTION_ENABLED:-true}"
      BACKFILL_DAYS: "${BACKFILL_DAYS:-2190}"
      CANDLE_INSTRUMENTS: "${CANDLE_INSTRUMENTS:-EUR_USD,GBP_USD,USD_JPY,AUD_USD,USD_CHF,USD_CAD}"
      CANDLE_GRANULARITIES: "${CANDLE_GRANULARITIES:-M1,M5,M10,M30,H1,H4,H12,D,W,M}"
    depends_on:
      postgres-uat:
        condition: service_healthy

  frontend-uat:
    build:
      context: ./portal/web
      dockerfile: Dockerfile
    container_name: agentfx-frontend-uat
    profiles: ["uat"]
    ports:
      - "5175:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8002/api/v1
      VITE_ENVIRONMENT: uat

volumes:
  postgres_data:
  postgres_test_data:
  postgres_uat_data:
