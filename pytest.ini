[pytest]
addopts = -q
pythonpath = .
markers =
    unit: Fast, isolated component tests
    integration: Multi-component or external service tests
    e2e: End-to-end user flow tests
    performance: Performance and load tests
    contracts: API and service contract tests
    slow: Tests that take longer to run
    auth: Authentication-related tests
    strategies: Trading strategy tests
    market_data: Market data and WebSocket tests
    backtest: Backtesting engine tests
