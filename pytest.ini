[pytest]
# Pytest configuration aligned with TEST_STRATEGY.md

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py *.spec.py
python_classes = Test*
python_functions = test_*

# Output formatting
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --cov=src/agentfx
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-fail-under=80

# Python path
pythonpath = .

# Markers (as defined in TEST_STRATEGY.md)
markers =
    unit: Unit tests - Fast, isolated component tests
    integration: Integration tests - Multi-component tests
    e2e: End-to-end tests - User journey tests
    performance: Performance tests - Load and stress tests
    contracts: API and service contract tests
    slow: Slow running tests (> 1 second)
    auth: Authentication-related tests
    strategies: Trading strategy tests
    market_data: Market data and WebSocket tests
    backtest: Backtesting engine tests
    oanda_real: Real OANDA integration tests - requires practice environment

# Minimum version requirements
minversion = 6.0

# Asyncio configuration
asyncio_mode = auto

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:websockets.*
