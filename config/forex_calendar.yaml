# Forex Market Calendar
# Source: SIFMA Holiday Schedule (https://www.sifma.org/resources/guides-playbooks/holiday-schedule)
#
# This file defines forex market closures used for gap detection.
# When updating for a new year:
# 1. Check SIFMA Holiday Schedule for official dates
# 2. Add new year entries below
# 3. No code changes required

# Weekly market hours (all times in UTC)
weekly:
  close_day: friday
  close_hour_utc: 22  # 5 PM ET (winter) / 21:00 UTC summer
  open_day: sunday
  open_hour_utc: 22

# Year-specific holidays (full market closures)
# Format: MM-DD
# Note: Observed dates shift when holidays fall on weekends
holidays:
  2020:
    - "01-01"  # New Year's Day
    - "04-10"  # Good Friday
    - "12-25"  # Christmas Day

  2021:
    - "01-01"  # New Year's Day
    - "04-02"  # Good Friday
    - "12-24"  # Christmas (Dec 25 = Saturday, observed Friday)

  2022:
    - "01-03"  # New Year's Day (Jan 1 = Saturday, observed Monday)
    - "04-15"  # Good Friday
    - "12-26"  # Christmas (Dec 25 = Sunday, observed Monday)

  2023:
    - "01-02"  # New Year's Day (Jan 1 = Sunday, observed Monday)
    - "04-07"  # Good Friday
    - "12-25"  # Christmas Day

  2024:
    - "01-01"  # New Year's Day
    - "03-29"  # Good Friday
    - "12-25"  # Christmas Day

  2025:
    - "01-01"  # New Year's Day
    - "04-18"  # Good Friday
    - "12-25"  # Christmas Day

  2026:
    - "01-01"  # New Year's Day
    - "04-03"  # Good Friday
    - "12-25"  # Christmas Day

# Early closes (reduced liquidity - gaps expected during/after these days)
# Format: MM-DD
early_closes:
  2020:
    - "04-09"   # Day before Good Friday
    - "05-22"   # Day before Memorial Day
    - "07-03"   # Day before Independence Day (July 4 = Saturday)
    - "12-24"   # Christmas Eve
    - "12-31"   # New Year's Eve

  2021:
    - "04-01"   # Day before Good Friday
    - "05-28"   # Day before Memorial Day
    - "07-02"   # Day before Independence Day (July 4 = Sunday)
    - "12-23"   # Christmas Eve (Dec 24 = observed holiday)
    - "12-31"   # New Year's Eve

  2022:
    - "04-14"   # Day before Good Friday
    - "05-27"   # Day before Memorial Day
    - "07-01"   # Day before Independence Day (July 4 = Monday)
    - "12-23"   # Christmas Eve
    - "12-30"   # New Year's Eve

  2023:
    - "04-06"   # Day before Good Friday
    - "05-26"   # Day before Memorial Day
    - "07-03"   # Day before Independence Day
    - "12-22"   # Day before Christmas Eve
    - "12-29"   # New Year's Eve

  2024:
    - "03-28"   # Day before Good Friday
    - "05-24"   # Day before Memorial Day
    - "07-03"   # Day before Independence Day
    - "12-24"   # Christmas Eve
    - "12-31"   # New Year's Eve

  2025:
    - "04-17"   # Day before Good Friday
    - "05-23"   # Day before Memorial Day
    - "07-03"   # Day before Independence Day
    - "12-24"   # Christmas Eve
    - "12-31"   # New Year's Eve

  2026:
    - "04-02"   # Day before Good Friday
    - "05-22"   # Day before Memorial Day
    - "07-02"   # Day before Independence Day (July 4 = Saturday)
    - "12-24"   # Christmas Eve
    - "12-31"   # New Year's Eve

# Low-liquidity hours (OANDA returns sparse data during these hours)
# Source: https://mechanicalforex.com/2015/12/oandas-not-so-good-1m-data-can-you-trust-your-own-brokers-historical-data.html
# 10-14% of M1 bars are missing during 22:00-07:00 GMT - this is expected behavior
low_liquidity_hours_utc:
  start: 22  # 10 PM UTC
  end: 7     # 7 AM UTC

# Maximum gap duration (hours) that qualifies as low-liquidity
# Gaps longer than this are NOT automatically attributed to low liquidity
low_liquidity_max_gap_hours: 12
