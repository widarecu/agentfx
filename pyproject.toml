[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "unit: marks tests as unit tests (fast, isolated)",
    "integration: marks tests as integration tests (medium speed, real dependencies)",
    "e2e: marks tests as end-to-end tests (slow, full stack)",
    "performance: marks tests as performance tests (very slow)",
    "oanda_real: marks tests as requiring real OANDA integration",
    "slow: marks tests as slow running (>10 seconds)",
    "market_data: marks tests related to market data functionality",
    "auth: marks tests related to authentication",
    "strategies: marks tests related to trading strategies",
]

# Test discovery patterns
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Coverage configuration
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/conftest.py",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 2
fail_under = 80

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "UP",   # pyupgrade (replaces standalone pyupgrade hook)
]
ignore = [
    "E501",  # line too long — handled by formatter where possible
    "E741",  # ambiguous variable name (l, O, I) — used in OHLC data
    "F841",  # local variable assigned but never used — too noisy for pre-commit
    "UP038", # use X | Y in isinstance — not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F811", "F401", "F821", "E402"]
"scripts/**" = ["F401"]
"migrations/**" = ["F401", "F403"]
