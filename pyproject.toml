[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "unit: marks tests as unit tests (fast, isolated)",
    "integration: marks tests as integration tests (medium speed, real dependencies)",
    "e2e: marks tests as end-to-end tests (slow, full stack)",
    "performance: marks tests as performance tests (very slow)",
    "oanda_real: marks tests as requiring real OANDA integration",
    "slow: marks tests as slow running (>10 seconds)",
    "market_data: marks tests related to market data functionality",
    "auth: marks tests related to authentication",
    "strategies: marks tests related to trading strategies",
]

# Test discovery patterns
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Coverage configuration.
#
# omit lists what `make test-unit` does NOT measure. The 80% fail_under
# threshold (below) gates `make test-unit`, so anything in this list is
# implicitly declared "not the unit-test stage's responsibility":
#
#   - tests / migrations / __pycache__: not source code.
#   - tools/gen_wireframes.py: one-shot PIL tooling that generates
#     planning artefacts — not library code, not run in production.
#   - portal_mock/: dev-only mock portal backend used in local
#     workflows. Behaviour is exercised manually; covering it under
#     unit tests would be testing the harness, not the system.
#   - services/cli.py: argparse shim that wraps backtest/ingest entry
#     points. The wrapped functions are already covered by their own
#     tests; the shim itself is integration-shaped (subprocess entry).
#   - services/ingest.py: OANDA + DB I/O ingestion worker — its happy
#     path is covered by `make test-integration` against the real
#     OANDA API. Measuring it under unit coverage would falsely
#     suggest it's untested when it isn't.
#   - api/routers/paper.py + api/services/paper.py +
#     api/routers/user_credentials.py + api/workers/paper_runner.py
#     (v0.6.0): the paper-trading HTTP + subprocess surface. Every
#     line is exercised by `tests/integration/test_paper_router.py`,
#     `test_user_credentials.py`, and `test_paper_runner_e2e.py`
#     against Postgres + FastAPI TestClient. Unit coverage would
#     require mocking the ORM + FastAPI dependencies extensively
#     without exercising real behaviour; router pure helpers still
#     have unit tests (`test_paper_router_helpers.py`).
#
# Library code that affects production decisions (anything under core/,
# everything in services/ besides cli/ingest, shared/config.py, agents/,
# api/) is NOT omitted — those carry the 80% threshold.
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/conftest.py",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/tools/gen_wireframes.py",
    "*/portal_mock/*",
    "*/services/cli.py",
    "*/services/ingest.py",
    "*/api/routers/paper.py",
    "*/api/routers/user_credentials.py",
    "*/api/services/paper.py",
    "*/api/workers/paper_runner.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 2
fail_under = 80

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "UP",   # pyupgrade (replaces standalone pyupgrade hook)
]
ignore = [
    "E501",  # line too long — handled by formatter where possible
    "E741",  # ambiguous variable name (l, O, I) — used in OHLC data
    "F841",  # local variable assigned but never used — too noisy for pre-commit
    "UP038", # use X | Y in isinstance — not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F811", "F401", "F821", "E402"]
"scripts/**" = ["F401"]
"migrations/**" = ["F401", "F403"]
