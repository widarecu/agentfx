name: Agent Fleet CI

# Three-tier gate CI for the Agent Fleet (v0.8.1 C.2 Phase 2):
#
#   agent/<task-slug>  --->  feat/agent-fleet  --->  main
#   │                        │                       │
#   │ auto-mergeable on      │ auto-mergeable on     │ Wilson's
#   │ green fast-gate here   │ green + label +       │ manual
#   │ (this workflow)        │ review-agent approval │ approval
#   │                        │ (Phase 2c)            │ (existing ci.yml
#   │                                                │  + manual review)
#
# What this workflow does:
#   1. On push to any `agent/**` branch OR PR into `feat/agent-fleet`:
#      Run ruff lint + ruff format + backend unit tests (no DB).
#      This is the FAST gate — ~1 min — because PE's inner loop
#      iterates against it.
#   2. On a labelled PR (`agent-authored`) into `feat/agent-fleet`
#      whose fast-gate has passed, enable auto-merge (squash).
#      Human-authored PRs into `feat/agent-fleet` don't get auto-
#      merged — Wilson reviews them.
#
# What this workflow DELIBERATELY does NOT do:
#   - Touch `main`. The existing `.github/workflows/ci.yml` owns main.
#   - Run integration tests. Those need OANDA + Postgres secrets and
#     take minutes; PE's inner loop needs feedback faster. Full ci.yml
#     still runs when `feat/agent-fleet` merges to main.
#   - Approve its own PRs. Review-agent approval is a Phase 2c task.

on:
  push:
    branches:
      - "agent/**"
      - "feat/agent-fleet"
    paths-ignore:
      - 'planning/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - 'portal/web/wireframes/**'
  pull_request:
    branches:
      - "feat/agent-fleet"
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - 'planning/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - 'portal/web/wireframes/**'

# Agent sub-branches may push rapid-fire during the PE inner loop;
# cancel in-flight runs for the same ref so cost + runner time stay
# bounded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Fast gate: lint + unit tests only. The whole point is sub-minute
  # feedback so PE's workspace can iterate.
  # ---------------------------------------------------------------------------
  fast-gate:
    name: Fast gate (lint + unit tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-api.txt -r requirements-dev.txt

      - name: Lint — ruff check
        run: ruff check src/

      - name: Lint — ruff format check
        run: ruff format --check src/

      - name: Verify JS↔Python parity fixture is current
        run: |
          ENVIRONMENT=test PYTHONPATH=src python scripts/dump_indicator_fixtures.py
          git diff --exit-code -- portal/web/tests/fixtures/indicator-values.json

      - name: Run unit tests
        run: ENVIRONMENT=test PYTHONPATH=src pytest tests/unit/ -v -m unit --no-cov

  # ---------------------------------------------------------------------------
  # Auto-merge: for PRs opened by the PE workspace into `feat/agent-fleet`,
  # once fast-gate is green and the `agent-authored` label is set, enable
  # GitHub's auto-merge (squash). Human-authored PRs stay manual.
  # ---------------------------------------------------------------------------
  auto-merge:
    name: Enable auto-merge (agent-authored PRs only)
    runs-on: ubuntu-latest
    needs: fast-gate
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.base.ref == 'feat/agent-fleet'
      && contains(github.event.pull_request.labels.*.name, 'agent-authored')
      && github.event.pull_request.draft == false

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # `--auto` makes GitHub squash-merge once ALL required
          # status checks are green. Fails cleanly if the repo has
          # "Allow auto-merge" turned off — Wilson needs to enable
          # it once in Settings → General → Pull Requests. Message
          # the surface here so the failure is self-explanatory in
          # the Actions log.
          if ! gh pr merge --squash --auto "$PR_URL"; then
            echo "::warning ::auto-merge could not be enabled — check that 'Allow auto-merge' is on in repo settings (General → Pull Requests)"
            exit 0
          fi
