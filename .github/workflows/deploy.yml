name: Deploy

# `paths-ignore` skips the entire deploy job (E2E + Railway + Vercel-via-Actions)
# when every changed path in a merge to main is docs. Prevents Railway backend
# rebuilds and Vercel frontend rebuilds for planning-only merges. The Vercel
# GitHub integration (Preview + Production) is separately gated by the
# `ignoreCommand` in portal/web/vercel.json.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'planning/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - 'portal/web/wireframes/**'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # E2E tests: full-stack validation before deployment
  # Starts backend + frontend, runs Playwright against real PostgreSQL.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E Tests
    # Pinned to 24.04: GitHub's `ubuntu-latest` rolled to 26.04 in late
    # October 2026, and Playwright 1.57.0 only ships deps for ≤24.04.
    # Attempting `--with-deps` on 26.04 bails with:
    #   "ERROR: Playwright does not support chromium on ubuntu26.04-x64"
    # Bump the pin when `@playwright/test` is upgraded to a release
    # that officially supports 26.04.
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: agentfx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d agentfx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt -r requirements-api.txt

      - name: Run migrations and seed data
        run: |
          alembic upgrade head
          python scripts/seed_instruments.py
          python scripts/seed_test_data.py
          python scripts/seed_test_candles.py
        env:
          ENVIRONMENT: test
          PYTHONPATH: src
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/agentfx_test

      - name: Start backend server
        run: |
          nohup uvicorn agentfx.api.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          # Wait for backend to be ready
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break || sleep 1
          done
          # Verify backend is responding
          curl -sf http://localhost:8000/health || (cat /tmp/backend.log && exit 1)
        env:
          ENVIRONMENT: test
          PYTHONPATH: src
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/agentfx_test
          SECRET_KEY: test-secret-key-for-e2e
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_ENV: practice
          INGESTION_ENABLED: "false"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portal/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: portal/web

      - name: Start frontend server
        run: |
          npm run dev:test &
          # Wait for frontend to be ready
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173 && break || sleep 1
          done
        working-directory: portal/web
        env:
          VITE_API_BASE_URL: http://localhost:8000/api/v1

      - name: Link E2E test dependencies
        run: ln -s ${{ github.workspace }}/portal/web/node_modules ${{ github.workspace }}/tests/e2e/node_modules

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: portal/web

      - name: Run E2E tests
        run: npx playwright test
        working-directory: portal/web
        env:
          NODE_PATH: ${{ github.workspace }}/portal/web/node_modules
          # Override Playwright defaults (Docker test profile ports 5174/8001)
          # because this CI job runs uvicorn/vite directly on 5173/8000 without
          # docker-compose. Once CI migrates to docker-compose these can be removed.
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          API_BASE_URL: http://localhost:8000/api/v1

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Deploy backend to Railway (only after E2E passes)
  # ---------------------------------------------------------------------------
  deploy-backend:
    name: Deploy Backend → Railway
    # needs: e2e  # Temporarily disabled until deployment is stable
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Railway CLI
        # `curl https://railway.app/install.sh | sh` fails on ubuntu-latest
        # because /bin/sh is dash, but the script uses bash-specific
        # ${var} substitution on line 145 — exit code 2 even though the
        # binary actually lands. The official npm package is the
        # canonical, shell-portable alternative.
        run: npm install --global @railway/cli

      - name: Deploy to Railway
        run: railway up --detach --service agentfx
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ---------------------------------------------------------------------------
  # Deploy frontend to Vercel (only after E2E passes)
  # ---------------------------------------------------------------------------
  deploy-frontend:
    name: Deploy Frontend → Vercel
    # needs: e2e  # Temporarily disabled until deployment is stable
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: portal/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portal/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # vercel@latest (62.4.0+) no longer accepts env-var-only project
      # linkage — the CLI needs a local .vercel/project.json file. The
      # `vercel pull` step below materialises that from the same env
      # vars we already provide, then `vercel deploy` can proceed as
      # before. See https://vercel.link/cannot-load-project-settings.
      # Added 2026-10-06 after CLI regression broke deploys. Also
      # paired with a refreshed VERCEL_TOKEN secret the same day.
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: .
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (production)
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: .
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
