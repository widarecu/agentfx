name: PR policy

# `pr-policy` (AFX-120): a PR into `main` must name exactly one AFX ticket
# (title + branch), that ticket must be In Progress or In Review, and a
# Money-path ticket needs Wilson's approval of the latest commit. The
# result is the `pr-policy` commit status on the PR head; the logic lives
# in scripts/pr_policy.py.
#
# Trust: both triggers run this file and the script from `main`, never
# the PR's code, so the Linear key and the fleet-bot token never meet
# untrusted code. pull_request_target covers PR events; reviews can't
# reach secrets or the `fleet-bot` environment from their own event, so
# pr-review-relay.yml (no permissions, no checkout) fires a workflow_run
# here. Event-driven only: no polling cron.
#
# Merge timing (AFX-130): auto-merge is only enabled by a run that passed
# after `CI required` went green on that head, pinned with
# --match-head-commit, so the merge happens seconds after a fresh check
# (a Linear move or a push since an older pass can't ride on it). The CI
# workflow_run is the run that normally does this. A failing run, or an
# auto-merge enabled by anyone else, gets auto-merge turned off.
#
# Scope: every PR into `main`. Since the cutover (AFX-125) there are no
# promote PRs or back-merges; `pr-policy` is a required check on `main`.
on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
      - auto_merge_enabled
      - review_request_removed
  workflow_run:
    workflows: ["PR review relay", "CI"]
    types: [completed]

permissions: {}

concurrency:
  group: pr-policy-${{ github.event.pull_request.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  policy:
    name: Evaluate PR policy
    if: >-
      github.event_name == 'pull_request_target'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
      checks: read
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
      pr: ${{ steps.check.outputs.pr }}
      sha: ${{ steps.check.outputs.sha }}
      disable: ${{ steps.check.outputs.disable }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Exit 1 (policy failed) is reported through the `pr-policy` status,
      # so the job stays green; exit 2 (GitHub/Linear unreachable) fails it.
      - name: Check ticket state and Money-path approval
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_PIPELINE_CLIENT_ID: ${{ secrets.LINEAR_PIPELINE_CLIENT_ID }}
          LINEAR_PIPELINE_CLIENT_SECRET: ${{ secrets.LINEAR_PIPELINE_CLIENT_SECRET }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            target=(--pr "$PR_NUMBER")
          else
            target=(--head-sha "$HEAD_SHA")
          fi
          rc=0
          python3 scripts/pr_policy.py "${target[@]}" || rc=$?
          [ "$rc" -le 1 ]

  auto-merge:
    name: Set auto-merge
    needs: policy
    if: >-
      always()
      && (needs.policy.outputs.eligible == 'true' || needs.policy.outputs.disable != '')
    runs-on: ubuntu-latest
    environment: fleet-bot
    timeout-minutes: 5
    permissions: {}
    steps:
      # An App token, not GITHUB_TOKEN, so the merge to `main` triggers the
      # push workflows (deploy) that GITHUB_TOKEN merges would not start.
      - name: Mint fleet-bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FLEET_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLEET_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Set auto-merge (squash, pinned to the checked commit)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ needs.policy.outputs.pr }}
          HEAD_SHA: ${{ needs.policy.outputs.sha }}
          DISABLE: ${{ needs.policy.outputs.disable }}
          REPO: ${{ github.repository }}
        run: |
          for n in $DISABLE; do
            gh pr merge "$n" --repo "$REPO" --disable-auto
          done
          if [ -n "$PR_NUMBER" ]; then
            gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --auto \
              --match-head-commit "$HEAD_SHA"
          fi
